const QUESTIONS=[{"id":1,"section":"ストラテジ系","topic":"DX","question":"DX（デジタルトランスフォーメーション）の説明として、最も適切なものはどれか。","options":["ネット回線を高速化すること","紙の資料をすべてPDFに変換すること","データとデジタル技術を用いて業務や組織の仕組みを変革すること","パソコンの台数を増やすこと"],"answer":2,"explanation":"DXは単なるデジタル化にとどまらず、業務プロセスや組織、顧客への価値提供を変える取組である。"},{"id":2,"section":"ストラテジ系","topic":"ERP","question":"企業が会計・人事・販売・在庫などの基幹業務データを統合して管理するシステムはどれか。","options":["DNS","ERP","CRM","CAD"],"answer":1,"explanation":"ERP（Enterprise Resource Planning）は企業資源と基幹業務情報を統合管理する仕組み。"},{"id":3,"section":"ストラテジ系","topic":"CRM","question":"顧客の購入履歴や問合せ内容を一元管理し、顧客との関係を強化する仕組みはどれか。","options":["CRM","WBS","VPN","SCM"],"answer":0,"explanation":"CRMはCustomer Relationship Managementの略で、顧客関係を管理・改善する考え方やシステムを指す。"},{"id":4,"section":"ストラテジ系","topic":"SCM","question":"原材料の調達から生産、物流、販売までの情報を連携し、供給全体を最適化する考え方はどれか。","options":["BCP","BPR","SFA","SCM"],"answer":3,"explanation":"SCM（Supply Chain Management）は供給連鎖全体を効率化する考え方。"},{"id":5,"section":"ストラテジ系","topic":"KPI","question":"学校が「資格試験の合格率80%以上」を目指すとき、達成状況を測る指標として最も適切なものはどれか。","options":["KPIとしての合格率","固定資産税率","CPUの利用率","データベースの表数"],"answer":0,"explanation":"KPIは重要業績評価指標。目標達成度を測るための具体的な数値を設定する。"},{"id":6,"section":"ストラテジ系","topic":"SWOT","question":"SWOT分析の「O」に該当するものはどれか。","options":["自校の教員数が不足している","自校に経験豊富な講師がいる","競合校が新学科を開設した","地域で救急教育への需要が高まっている"],"answer":3,"explanation":"OはOpportunity（機会）で、自組織の外部環境にある好機を指す。"},{"id":7,"section":"ストラテジ系","topic":"PEST","question":"PEST分析の対象に含まれないものはどれか。","options":["政治・法制度の変化","経済情勢の変化","社内の個人別勤務表","技術革新"],"answer":2,"explanation":"PESTは政治（Political）、経済（Economic）、社会（Social）、技術（Technological）という外部環境の分析。"},{"id":8,"section":"ストラテジ系","topic":"3C分析","question":"3C分析の三つのCとして、正しい組合せはどれか。","options":["Customer・Competitor・Company","Code・CPU・Client","Control・Change・Check","Cost・Cash・Cloud"],"answer":0,"explanation":"3C分析は顧客・市場（Customer）、競合（Competitor）、自社（Company）の三つから事業環境を整理する。"},{"id":9,"section":"ストラテジ系","topic":"PDCA","question":"PDCAサイクルで、実施結果を評価し目標との差を確認する段階はどれか。","options":["Check","Act","Plan","Do"],"answer":0,"explanation":"Checkは結果の確認・評価の段階。改善の実行はActに当たる。"},{"id":10,"section":"ストラテジ系","topic":"BPR","question":"従来の業務手順を根本から見直し、業務プロセスを再設計する取組はどれか。","options":["HTML","BPR","OCR","NAS"],"answer":1,"explanation":"BPR（Business Process Re-engineering）は業務の抜本的な改革・再設計を指す。"},{"id":11,"section":"ストラテジ系","topic":"RPA","question":"RPAの典型的な利用例として、最も適切なものはどれか。","options":["サーバの部品を自動交換する","法令を自動的に改正する","患者の診断を無条件に確定する","毎朝同じ形式のファイルからデータを転記する"],"answer":3,"explanation":"RPAは定型的なパソコン操作の自動化に向いている。判断が複雑な業務は別途設計が必要。"},{"id":12,"section":"ストラテジ系","topic":"BI","question":"BI（ビジネスインテリジェンス）の主な目的はどれか。","options":["データを集計・可視化し意思決定を支援する","ディスクを物理的に破壊する","通信を必ず無線化する","パスワードを自動生成して配布する"],"answer":0,"explanation":"BIは業務データを分析・可視化して、判断に役立つ情報を提供する。"},{"id":13,"section":"ストラテジ系","topic":"投資回収","question":"システム導入費用が200万円、導入による年間の正味効果が50万円のとき、単純な投資回収期間は何年か。","options":["5年","2年","3年","4年"],"answer":3,"explanation":"200万円÷50万円/年＝4年。単純回収期間の計算であり、金利などは考慮していない。"},{"id":14,"section":"ストラテジ系","topic":"損益分岐点","question":"1個当たり販売価格5,000円、変動費3,000円、月間固定費120,000円の商品の損益分岐点販売数量は何個か。","options":["24個","40個","50個","60個"],"answer":3,"explanation":"1個の限界利益は2,000円。120,000÷2,000＝60個。"},{"id":15,"section":"ストラテジ系","topic":"会計","question":"売上高300万円、売上原価180万円のとき、売上総利益はいくらか。","options":["180万円","300万円","480万円","120万円"],"answer":3,"explanation":"売上総利益＝売上高－売上原価＝300－180＝120万円。"},{"id":16,"section":"ストラテジ系","topic":"個人情報保護","question":"個人情報の取扱いとして、最も適切なものはどれか。","options":["名簿の利用目的を明確にし、必要な安全管理措置をとる","個人情報を含むファイルを誰でも見られる公開URLに置く","個人情報の取扱いに本人の権利は存在しない","取得した学生情報を目的外に自由に利用する"],"answer":0,"explanation":"個人情報は利用目的を適切に特定し、必要な安全管理措置を講じることが重要。"},{"id":17,"section":"ストラテジ系","topic":"匿名加工情報","question":"仮名加工情報と匿名加工情報の違いとして、最も適切なものはどれか。","options":["匿名加工情報は再識別のための照合表を自由に公開してよい","どちらも無加工の個人情報である","仮名加工情報は本人識別できる情報を必ず残す","匿名加工情報は復元して本人を識別できないよう所定の加工をした情報である"],"answer":3,"explanation":"匿名加工情報は特定の個人を識別できず、元の個人情報を復元できないよう所定の加工をしたもの。仮名加工情報とは法的な扱いが異なる。"},{"id":18,"section":"ストラテジ系","topic":"著作権","question":"著作権について正しい説明はどれか。","options":["他人の著作物は出典を書けば必ず自由に複製できる","著作権は創作と同時に原則として発生する","著作権は特許庁への出願が必須である","インターネット上の画像はすべて著作権がない"],"answer":1,"explanation":"著作権は原則として創作時に発生する。引用や利用は法律の要件・利用許諾などを確認する。"},{"id":19,"section":"ストラテジ系","topic":"OSS","question":"オープンソースソフトウェア（OSS）の利用について、適切なものはどれか。","options":["OSSの利用・改変・再配布は各ライセンス条件に従う","OSSには著作権が存在しない","OSSはすべて商用利用禁止である","OSSは必ず無条件で改変・再配布できる"],"answer":0,"explanation":"OSSであっても著作権とライセンス条件があり、条件はライセンスによって異なる。"},{"id":20,"section":"ストラテジ系","topic":"営業秘密","question":"企業の営業秘密として保護されるために重要な要件の組合せはどれか。","options":["秘密管理性・有用性・非公知性","収益性・即時性・公開性","高速性・匿名性・互換性","独創性・新規性・進歩性のみ"],"answer":0,"explanation":"不正競争防止法上の営業秘密の要件は秘密管理性、有用性、非公知性の三つ。"},{"id":21,"section":"ストラテジ系","topic":"BCP","question":"BCP（事業継続計画）の説明として、適切なものはどれか。","options":["顧客満足度だけを測定する手順","全ての災害を事前に防止するための装置","災害時などでも重要な業務を継続・早期復旧する計画","新製品の広告を決める計画"],"answer":2,"explanation":"BCPは災害・事故などで事業が停止するリスクに備え、重要業務の継続と早期復旧を計画するもの。"},{"id":22,"section":"ストラテジ系","topic":"デジタルデバイド","question":"デジタルデバイドとはどのような問題か。","options":["情報通信技術を利用できる人とできない人の間に生じる格差","データを二つの表に分割すること","二つのネットワークを接続すること","通信速度の単位を変換すること"],"answer":0,"explanation":"デジタルデバイドはICTへのアクセスや利用能力の差による情報格差を指す。"},{"id":23,"section":"ストラテジ系","topic":"RFM分析","question":"購買分析のRFM分析における「F」が表すものはどれか。","options":["Function：機能","Forecast：予測","Fixed cost：固定費","Frequency：購入頻度"],"answer":3,"explanation":"RFMはRecency（最近の購入）、Frequency（購入頻度）、Monetary（購入金額）の指標。"},{"id":24,"section":"ストラテジ系","topic":"マーケティング4P","question":"マーケティングの4Pに含まれないものはどれか。","options":["Promotion（販売促進）","Patent（特許）","Product（製品）","Price（価格）"],"answer":1,"explanation":"4PはProduct、Price、Place（流通）、Promotionの四つ。"},{"id":25,"section":"ストラテジ系","topic":"電子商取引","question":"企業同士の電子商取引を表す用語はどれか。","options":["C2C","B2B","G2C","B2C"],"answer":1,"explanation":"B2B（Business to Business）は企業間取引を指す。"},{"id":26,"section":"ストラテジ系","topic":"FinTech","question":"フィンテック（FinTech）の例として適切なものはどれか。","options":["無線周波数の測定器","AIやスマホを使う決済・金融サービス","人の移動をなくす建築工法","木材の加工技術"],"answer":1,"explanation":"FinTechは金融（Finance）と技術（Technology）を組み合わせたサービスや取組。"},{"id":27,"section":"ストラテジ系","topic":"IoT","question":"IoTの具体例として最も適切なものはどれか。","options":["端末の電源を抜いて保管する","救急資機材の保管庫内温度をセンサーで計測しネット経由で確認する","紙の日誌を鍵付き棚にしまう","照明スイッチを手動で入れる"],"answer":1,"explanation":"IoTはモノにセンサーや通信機能などを備え、ネットワークを通じてデータ収集・制御する仕組み。"},{"id":28,"section":"ストラテジ系","topic":"AIとバイアス","question":"AIモデルの運用において、学習データの偏りによって起こり得る問題はどれか。","options":["ある集団に対する予測精度が不当に低くなる","データベースの容量が常にゼロになる","推論の際に電力が一切不要になる","すべての予測が必ず正しくなる"],"answer":0,"explanation":"データの偏りはAIのバイアスや公平性の問題につながる。評価対象を分けて精度を確認することが重要。"},{"id":29,"section":"ストラテジ系","topic":"生成AI","question":"生成AIのハルシネーションとは何か。","options":["通信経路の暗号化","ファイルの重複削除","学習速度の自動向上","誤った内容をもっともらしく出力すること"],"answer":3,"explanation":"生成AIは事実に反する内容を自然な文章で生成する場合がある。重要な事項は一次資料で確認する。"},{"id":30,"section":"ストラテジ系","topic":"PoC","question":"新しいアプリを全校展開する前に、小規模な試行で技術的実現性を確認する活動を何というか。","options":["DNSキャッシュ","OCR","デフラグ","PoC（概念実証）"],"answer":3,"explanation":"PoCはProof of Concept。新技術やアイデアの実現可能性を小規模に確かめること。"},{"id":31,"section":"ストラテジ系","topic":"データ活用","question":"売上や問合せ件数などから傾向を読み取り、仮説を立てて改善につなげる際に適切な姿勢はどれか。","options":["相関があれば必ず因果関係があると断定する","データの定義・収集条件・偏りを確認する","少数例だけで必ず全体を代表すると考える","都合の悪いデータを削除して結論を合わせる"],"answer":1,"explanation":"データ分析では指標の定義、データ品質、バイアス、相関と因果の違いを意識する。"},{"id":32,"section":"ストラテジ系","topic":"知的財産","question":"特許権が主として保護する対象はどれか。","options":["すべての数学的事実","技術的思想の創作である発明","単なる企業名そのもの","社員の勤怠記録"],"answer":1,"explanation":"特許権は一定の要件を満たして登録された発明を保護する。名称やマークは主に商標権の領域。"},{"id":33,"section":"ストラテジ系","topic":"グリーンIT","question":"企業が環境負荷や消費電力を考慮してICTを調達・運用する取組に近いものはどれか。","options":["ソーシャルエンジニアリング","グリーンIT","スパムメール","クラッキング"],"answer":1,"explanation":"グリーンITはICTの省エネ化やICTによる社会全体の環境負荷削減を目指す。"},{"id":34,"section":"ストラテジ系","topic":"利害関係者","question":"組織の活動に影響を与える、またはその活動から影響を受ける人や団体を何と呼ぶか。","options":["パーティション","プロトコル","ステークホルダー","スクリプト"],"answer":2,"explanation":"ステークホルダーは利害関係者。学校なら学生、教職員、保護者、実習先などが例。"},{"id":35,"section":"ストラテジ系","topic":"IT投資評価","question":"限られた予算でアプリ導入案を比較するとき、意思決定として最も適切なのはどれか。","options":["導入費だけを比べ、維持費や効果は無視する","費用、導入効果、リスク、運用負荷などを総合評価する","製品名の知名度だけで決める","実績のない仕様を確認せず契約する"],"answer":1,"explanation":"IT投資の判断では初期費用だけでなく、運用費（TCO）、効果、リスクも評価する。"},{"id":36,"section":"マネジメント系","topic":"開発モデル","question":"ウォーターフォール型開発の特徴として最も適切なのはどれか。","options":["ユーザーとの確認を法律で禁止する","要件定義・設計・実装・テストなどを段階的に進める","計画を一切作らず開発する","必ず1日で完成させる"],"answer":1,"explanation":"ウォーターフォールは工程を順に進める計画重視型の開発モデル。"},{"id":37,"section":"マネジメント系","topic":"アジャイル","question":"アジャイル開発の特徴として最も適切なのはどれか。","options":["ソフトウェアをテストしない","全機能を完成するまで利用者に見せない","短い反復で開発・評価し、変更に対応する","変更要求を必ず拒否する"],"answer":2,"explanation":"アジャイルでは短期間の反復を繰り返し、利用者のフィードバックを反映する。"},{"id":38,"section":"マネジメント系","topic":"WBS","question":"WBSの主な目的はどれか。","options":["パソコンの故障を予測する","プロジェクトの作業を階層的に分解して整理する","電子メールを暗号化する","データを圧縮する"],"answer":1,"explanation":"WBS（Work Breakdown Structure）は成果物や作業を分解し、範囲・担当・工数の管理に役立てる。"},{"id":39,"section":"マネジメント系","topic":"ガントチャート","question":"タスクの開始日、終了日、進捗状況を時間軸上の棒で示す管理図はどれか。","options":["ヒストグラム","散布図","ガントチャート","ER図"],"answer":2,"explanation":"ガントチャートは作業の期間や進捗を横棒で表した工程管理図。"},{"id":40,"section":"マネジメント系","topic":"クリティカルパス","question":"あるプロジェクトでは、作業A（2日）の後に作業B（3日）と作業C（5日）を並行して行い、両方完了後にD（1日）を行う。最短所要日数は何日か。","options":["8日","11日","6日","7日"],"answer":0,"explanation":"A（2日）→長い方のC（5日）→D（1日）で合計8日。BとCは並行可能。"},{"id":41,"section":"マネジメント系","topic":"リスク管理","question":"リスク管理の初期段階として、最も適切な活動はどれか。","options":["トラブル後に必ず隠す","担当者を無条件に処分する","起こり得るリスクを洗い出す","全てのリスクを無視する"],"answer":2,"explanation":"リスク管理ではまずリスクを特定し、発生可能性・影響度を評価して対応策を検討する。"},{"id":42,"section":"マネジメント系","topic":"単体テスト","question":"プログラムの個々の関数や部品が仕様どおり動作するか確認するテストはどれか。","options":["単体テスト","運用監査","負荷分散","受入テスト"],"answer":0,"explanation":"単体テストは関数・モジュールなど小さな単位の動作確認。"},{"id":43,"section":"マネジメント系","topic":"受入テスト","question":"完成したシステムが業務上の要求を満たすか、利用者側の観点で確認するテストはどれか。","options":["単体テスト","静的解析のみ","デフラグ","受入テスト"],"answer":3,"explanation":"受入テストはユーザーの要求に適合するかを検証するテスト。"},{"id":44,"section":"マネジメント系","topic":"回帰テスト","question":"システム改修後、以前は正常だった機能が影響を受けていないか確かめるテストはどれか。","options":["絶縁試験","ベンチマーク","回帰テスト（リグレッションテスト）","耐火試験"],"answer":2,"explanation":"回帰テストは変更による既存機能への悪影響（デグレード）を検出する。"},{"id":45,"section":"マネジメント系","topic":"バージョン管理","question":"Gitなどのバージョン管理システムの利用目的として適切なのはどれか。","options":["ネットワーク機器を冷却する","ソースコードの変更履歴を記録し、共同開発を支援する","停電時に電力を供給する","パスワードの使い回しを推奨する"],"answer":1,"explanation":"バージョン管理では変更履歴の追跡、差分比較、ブランチ作業などができる。"},{"id":46,"section":"マネジメント系","topic":"構成管理","question":"ITサービスの「構成管理」で主に管理するものはどれか。","options":["広告のキャッチコピーだけ","市場の株価のみ","IT機器やソフトウェア等の構成要素とその関係","社員の昼食メニュー"],"answer":2,"explanation":"構成管理はサービスを構成する機器、ソフト、設定、関係性などを把握する。"},{"id":47,"section":"マネジメント系","topic":"サービスデスク","question":"利用者からのITに関する問い合わせを一元的に受け付ける窓口を何というか。","options":["DNSサーバ","ロードバランサ","サービスデスク","ファイアウォール"],"answer":2,"explanation":"サービスデスクは問い合わせや障害報告を受ける窓口として機能する。"},{"id":48,"section":"マネジメント系","topic":"SLA","question":"SLAの説明として適切なのはどれか。","options":["端末の画面を大きくすること","顧客情報を公開すること","データを物理破壊すること","サービスの品質や可用性などについて提供者と利用者が合意すること"],"answer":3,"explanation":"SLA（Service Level Agreement）はサービスレベルに関する合意。"},{"id":49,"section":"マネジメント系","topic":"インシデント管理","question":"一時的にシステムが利用できない障害への迅速な復旧を重視する活動はどれか。","options":["特許出願","棚卸資産評価","インシデント管理","製品広告管理"],"answer":2,"explanation":"インシデント管理はサービスを速やかに正常化し、利用者への影響を小さくする。"},{"id":50,"section":"マネジメント系","topic":"問題管理","question":"障害を繰り返す原因を分析し、根本原因の除去を図る活動はどれか。","options":["販売促進","アクセス解析のみ","問題管理","印刷管理"],"answer":2,"explanation":"問題管理はインシデントの根本原因を分析し、再発防止につなげる。"},{"id":51,"section":"マネジメント系","topic":"RTO・RPO","question":"RTO（目標復旧時間）が4時間と定められているシステムの説明として適切なものはどれか。","options":["4時間ごとに必ず再起動する","4時間の連続稼働だけを保証する","障害発生から4時間以内に復旧することを目標とする","過去4時間分のデータ消失を許容する"],"answer":2,"explanation":"RTOは目標復旧時間。どこまで過去のデータに戻してよいかを示すのはRPO。"},{"id":52,"section":"マネジメント系","topic":"バックアップ計画","question":"バックアップにおける3-2-1ルールの基本的な考え方はどれか。","options":["3つのデータコピーを、2種類の媒体に置き、1つは別拠点に保管する","3人が2時間交代で1台のPCを使う","3日ごとにデータを全消去する","3個のパスワードを毎日2回変更する"],"answer":0,"explanation":"3-2-1はデータの複数コピー・異種媒体・オフサイト保管を組み合わせる一般的なバックアップ指針。"},{"id":53,"section":"マネジメント系","topic":"システム監査","question":"情報システム監査で求められる監査人の立場はどれか。","options":["監査対象から独立し、公正に評価する","開発者の評価を無条件で受け入れる","問題を発見しても隠す","監査証拠を残さない"],"answer":0,"explanation":"監査では独立性・客観性と適切な監査証拠が重要。"},{"id":54,"section":"マネジメント系","topic":"可用性計算","question":"あるサービスが1か月（30日間）に合計43.2分停止した。月間稼働率は約何％か。","options":["99.9％","90.0％","95.0％","99.0％"],"answer":0,"explanation":"30日＝43,200分。稼働率＝(43,200－43.2)÷43,200×100＝99.9％。"},{"id":55,"section":"マネジメント系","topic":"変更管理","question":"新システムを本番環境に適用する際の変更管理として適切なのはどれか。","options":["テストせず即時に全端末へ適用する","変更記録を残さない","影響・リスク・復旧手順を評価して承認を得る","管理者に知らせず変更する"],"answer":2,"explanation":"変更管理では影響評価、承認、実施計画、切戻し方法、記録が重要。"},{"id":56,"section":"テクノロジ系","topic":"2進数","question":"2進数の1011を10進数で表した値はどれか。","options":["13","9","10","11"],"answer":3,"explanation":"1011(2)=8＋0＋2＋1＝11(10)。"},{"id":57,"section":"テクノロジ系","topic":"16進数","question":"16進数の「1F」を10進数で表した値はどれか。","options":["32","16","30","31"],"answer":3,"explanation":"1F(16)=1×16＋15＝31(10)。"},{"id":58,"section":"テクノロジ系","topic":"情報量の単位","question":"1KiB（キビバイト）は何バイトか。","options":["1,024バイト","10,000バイト","100バイト","1,000バイト"],"answer":0,"explanation":"KiBは2の10乗バイト。kB（10の3乗）と区別する。"},{"id":59,"section":"テクノロジ系","topic":"通信速度","question":"100Mbpsの回線で、実効速度が理論値どおりと仮定した場合、800Mビットのデータ転送に必要な時間は何秒か。","options":["8秒","16秒","80秒","4秒"],"answer":0,"explanation":"800Mビット÷100Mビット/秒＝8秒。実通信では遅延や制御情報がある。"},{"id":60,"section":"テクノロジ系","topic":"CPU","question":"CPUの主な役割はどれか。","options":["命令を実行し演算や制御を行う","紙に文字を印刷する","電源を長期保存する","画面を清掃する"],"answer":0,"explanation":"CPUは命令を処理し、演算・制御を担うコンピュータの中心部品。"},{"id":61,"section":"テクノロジ系","topic":"キャッシュメモリ","question":"キャッシュメモリの主な目的はどれか。","options":["通信を暗号化する","CPUと主記憶の速度差を緩和する","紙の書類を保存する","ディスクの容量を必ず増やす"],"answer":1,"explanation":"高速なキャッシュを利用し、CPUがよく使うデータへ迅速にアクセスできるようにする。"},{"id":62,"section":"テクノロジ系","topic":"RAM","question":"一般的なRAMの特徴として最も適切なものはどれか。","options":["印刷専用の機器である","電源を切っても必ず内容が保持される","電源断で内容が失われる揮発性の主記憶である","外部通信だけを担当する"],"answer":2,"explanation":"一般的なDRAMなどのRAMは揮発 function timeleft(){return Math.max(0,Math.ceil((state.deadline-Date.now())/1000))}
function formatTime(sec){return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec/60)%60).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function begin(mode){if(state.started&&!state.finished&&!confirm('保存されている解答をリセットして開始します。よろしいですか？'))return;state={started:true,finished:false,mode,answers:{},flags:{},current:0,startedAt:Date.now(),deadline:mode==='exam'?Date.now()+120*60*1000:null,finishedAt:null};save();render();}
function reset(){if(!confirm('解答をすべて消して最初に戻ります。よろしいですか？'))return;state={started:false,finished:false,mode:'exam',answers:{},flags:{},current:0,startedAt:null,deadline:null,finishedAt:null};save();render();}
function choose(i){if(state.finished)return;state.answers[state.current]=i;save();renderQuestion();renderAside();}
function move(i){state.current=Math.max(0,Math.min(99,i));save();renderQuestion();renderAside();window.scrollTo({top:0,behavior:'smooth'});}
function flagCurrent(){state.flags[state.current]=!state.flags[state.current];save();renderQuestion();renderAside();}
function submitExam(){const missed=100-answered();if(!confirm(missed?`未解答が${missed}問あるで。採点して終了する？`:'100問すべて解答済み。採点して終了する？'))return;complete(false);}
function complete(auto){state.finished=true;state.finishedAt=Date.now();save();render();if(auto)alert('120分が経過したため、模擬試験を終了・採点しました。');}
function classify(section){return section==='ストラテジ系'?'s':section==='マネジメント系'?'m':''}
function tag(section){return `<span class="tag ${classify(section)}">${escaping(section)}</span>`;}
function render(){let view=$('view');if(!state.started){view.innerHTML=renderIntro();return;}if(state.finished){view.innerHTML=renderResults();return;}view.innerHTML=`<div class="layout"><div class="card" id="qcontent"></div><aside class="card" id="aside"></aside></div>`;renderQuestion();renderAside()}
function renderIntro(){return "\n<div class=\"lp\">\n  <section class=\"hero\" aria-label=\"ITパスポート模擬テスト\">\n    <div class=\"hero-copy\">\n      <div class=\"eyebrow\">TOYO MEDICAL COLLEGE / DX SEMINAR</div>\n      <h1>医療の未来を、<br>ITでひらく。</h1>\n      <p>知っているつもりのIT知識を、確かな実力へ。東洋医療専門学校のDX学習コンテンツで、ITパスポートの知識を100問の模擬テストでチェックしよう。</p>\n      <div class=\"hero-pills\"><span>受験料不要・無料</span><span>登録なしで挑戦</span><span>スマホ対応</span></div>\n      <div class=\"button-row\"><a class=\"btn green\" href=\"#exam-start\">無料で模擬テストを受ける →</a><a class=\"btn ghost-light\" href=\"#about-app\">テストの特徴を見る</a></div>\n    </div>\n    <div class=\"hero-art\" aria-hidden=\"true\"><div class=\"art-grid\"></div><div class=\"art-ring\"><div class=\"art-card\"><div class=\"art-label\">IT PASSPORT</div><div class=\"art-score\">100</div><div class=\"art-label\">MOCK QUESTIONS</div><div class=\"art-chip\">STEP INTO THE FUTURE ↗</div></div></div></div>\n  </section>\n  <div class=\"stat-strip\"><div class=\"stat-tile\"><b>100</b><span>オリジナル問題</span></div><div class=\"stat-tile\"><b>120</b><span>制限時間（分）</span></div><div class=\"stat-tile\"><b>3</b><span>出題分野</span></div><div class=\"stat-tile\"><b>0<span style=\"font-size:15px\">円</span></b><span>利用料金</span></div></div>\n  <section id=\"about-app\" class=\"lp-section\">\n    <div class=\"section-kicker\">FEATURES</div><h2 class=\"section-heading\">本番を想定して、しっかり力試し。</h2>\n    <p class=\"lp-description\">ITパスポートの出題領域を参考にした独自の4択問題を収録。ストラテジ系・マネジメント系・テクノロジ系をバランスよく学べる、教員・学生・一般の方のための無料学習ツールです。</p>\n    <div class=\"lp-feature-grid\">\n      <div class=\"lp-feature\"><div class=\"icon-sq\">01</div><h3>本番と同じ100問・120分</h3><p>実戦的な時間配分を身につける「試験モード」と、時間を気にせず取り組める「練習モード」を用意。</p></div>\n      <div class=\"lp-feature\"><div class=\"icon-sq\">02</div><h3>採点・分野別分析</h3><p>提出すると自動採点。分野ごとの正答率から、得意分野と重点的に復習したい分野が見えてきます。</p></div>\n      <div class=\"lp-feature\"><div class=\"icon-sq\">03</div><h3>全問解説・復習機能</h3><p>全100問の正答と解説を表示。間違えた問題だけを絞り込んだり、結果をCSVで保存したりできます。</p></div>\n    </div>\n  </section>\n  <section id=\"exam-start\" class=\"lp-exam\" aria-label=\"模擬試験開始\">\n    <div class=\"section-kicker\">START YOUR CHALLENGE</div><h2 class=\"section-heading\">準備はええ？ここからスタート。</h2>\n    <p class=\"lp-description\">氏名・メールアドレスの登録なし。解答は利用中のブラウザ内に保存され、個人情報をサーバーに送信する機能はありません。</p>\n    <div class=\"lp-mode-grid\">\n      <div class=\"lp-mode\"><span class=\"tiny\">CHALLENGE 01 · EXAM</span><h3>試験モード</h3><p>120分のカウントダウン付き。解答途中でも保存され、時間切れになると自動で採点します。</p><button type=\"button\" class=\"btn green\" onclick=\"begin('exam')\">試験モードで開始 →</button></div>\n      <div class=\"lp-mode\"><span class=\"tiny\">CHALLENGE 02 · PRACTICE</span><h3>練習モード</h3><p>時間制限なし。自分のペースで100問を解きながら、試験範囲の理解度を確認できます。</p><button type=\"button\" class=\"btn secondary\" onclick=\"begin('practice')\">練習モードで開始 →</button></div>\n    </div>\n  </section>\n  <section class=\"lp-school\" aria-label=\"東洋医療専門学校のご案内\">\n    <div><div class=\"section-kicker\">LEARN MORE ABOUT TOYO</div><h2>救う力に、<br>新しい学びの視点を。</h2><p>大阪・新大阪の東洋医療専門学校。救急救命士をはじめ、医療系専門職を目指す学びを展開しています。医療の専門性とDX・情報活用の知識をつなぐ学びに、ぜひ触れてみてください。</p>\n    <div class=\"lp-links\"><a href=\"https://www.toyoiryo.ac.jp/gakka/elt\" target=\"_blank\" rel=\"noopener noreferrer\">救急救命士学科について ↗</a><a class=\"light\" href=\"https://www.toyoiryo.ac.jp/oc/\" target=\"_blank\" rel=\"noopener noreferrer\">オープンキャンパス ↗</a><a class=\"light\" href=\"https://www.toyoiryo.ac.jp/form/shiryo\" target=\"_blank\" rel=\"noopener noreferrer\">資料請求 ↗</a></div></div>\n    <div class=\"lp-school-mark\"><span>TOYO MEDICAL COLLEGE</span><div class=\"line\"></div><strong>東洋医療専門学校</strong><span>EMERGENCY MEDICAL TECHNICIAN</span><p style=\"font-size:12px;color:#637c88\">大阪・新大阪<br>救急救命士学科</p></div>\n  </section>\n  <p class=\"lp-disclaimer\">※本アプリはITパスポート試験の学習領域を参考に作成した<strong>非公式の独自問題集</strong>です。IPAの公式問題・試験ではなく、実際の合格を保証するものではありません。模擬結果は正答率による学習用の目安であり、本試験のIRT評価点とは異なります。正式な試験日程・出題範囲はIPA公式情報を確認してください。<br>※本コンテンツの提供は、ITパスポート資格が学校の正式な取得必修科目であることを示すものではありません。</p>\n</div>";}
function renderQuestion(){const q=QUESTIONS[state.current];const i=state.current;const selected=state.answers[i];$('qcontent').innerHTML=`<div class="row"><div class="section">${tag(q.section)} <span class="meta">${escaping(q.topic)}</span></div><span class="meta">問題 ${q.id} / 100</span></div><div class="question-title">${escaping(q.question)}</div><div role="radiogroup" aria-label="第${q.id}問の解答">${q.options.map((op,n)=>`<label class="option ${selected===n?'active':''}"><input type="radio" name="answer" ${selected===n?'checked':''} onchange="choose(${n})"><span class="letter">${labels[n]}</span><span class="option-text">${escaping(op)}</span></label>`).join('')}</div><div class="nav-btns"><button class="btn outline" onclick="move(${i-1})" ${i===0?'disabled':''}>← 前の問題</button><button class="btn secondary" onclick="flagCurrent()">${state.flags[i]?'★ 要確認を解除':'☆ 要確認にする'}</button><button class="btn" onclick="move(${i+1})" ${i===99?'disabled':''}>次の問題 →</button></div><p class="meta" style="margin-top:17px">キーボード操作：1〜4で選択、← → で問題移動</p>`;}
function renderAside(){let left=state.mode==='exam'?formatTime(timeleft()):'制限なし';$('aside').innerHTML=`<div class="row"><span class="meta">${state.mode==='exam'?'残り時間':'練習モード'}</span><span class="clock ${state.mode==='exam'&&timeleft()<600?'low':''}" id="clock">${left}</span></div><hr class="divider"><div class="row"><strong class="answer-meter" id="progressText">${answered()} / 100 解答</strong><span class="meta">${100-answered()}問 未解答</span></div><div class="progress" style="margin:12px 0"><div class="fill" style="width:${answered()}%"></div></div><h3 style="margin-top:21px">問題一覧（クリックで移動）</h3><div class="qgrid">${QUESTIONS.map((q,i)=>`<button title="第${i+1}問 ${escaping(q.section)}" class="num ${state.answers[i]!==undefined?'answered':''} ${state.current===i?'current':''} ${state.flags[i]?'flag':''}" onclick="move(${i})">${i+1}</button>`).join('')}</div><div class="meta">緑：解答済み　●：要確認</div><hr class="divider"><div class="button-row"><button class="btn green" style="flex:1" onclick="submitExam()">採点して終了</button><button class="btn danger" onclick="reset()">リセット</button></div>`;}
function counts(section){const qs=QUESTIONS.filter(q=>q.section===section);return{correct:qs.filter(q=>state.answers[q.id-1]===q.answer).length,total:qs.length};}
function renderResults(){const total=QUESTIONS.filter(q=>state.answers[q.id-1]===q.answer).length;const notAnswered=100-answered();const rate=total;const sections=['ストラテジ系','マネジメント系','テクノロジ系'];return `<div class="card"><div class="scorehero"><p>ITパスポート 模擬試験｜採点結果</p><h2>${total} <span style="font-size:22px">/ 100問</span></h2><p>正答率 ${rate}%　／　未解答 ${notAnswered}問</p><h3 style="color:#c3fff1">${rate>=60&&sections.every(s=>counts(s).correct/counts(s).total>=.3)?'合格目安を満たしています（参考）':'目安を満たしていない分野を復習しましょう'}</h3></div><h2>分野別成績</h2><div class="score-grid">${sections.map(s=>{let r=counts(s),pct=Math.round(100*r.correct/r.total);return `<div class="score-box">${tag(s)}<strong>${pct}%</strong><span>${r.correct} / ${r.total} 問正解</span><div class="progress" style="margin-top:9px"><div class="fill" style="width:${pct}%"></div></div></div>`}).join('')}</div><div class="notice" style="margin-top:17px">判定は「総合60%以上・各分野30%以上」を使った学習用の目安です。IPAの本試験はIRT方式で採点するため、この模擬試験から正式な合否は判定できません。得意・不得意の把握に利用してください。</div><div class="button-row"><button class="btn green" onclick="window.print()">結果と解説を印刷</button><button class="btn outline" onclick="downloadCSV()">結果をCSVで保存</button><button class="btn danger" onclick="reset()">解答を消してもう一度</button></div><hr class="divider"><div class="row"><h2>全100問の正答と解説</h2><div class="filter-row"><button class="btn secondary" onclick="filterReview('all')">全問表示</button><button class="btn secondary" onclick="filterReview('miss')">不正解・未解答のみ</button></div></div><div class="review">${QUESTIONS.map(q=>{let ans=state.answers[q.id-1],ok=ans===q.answer;return `<article class="reviewitem ${ok?'good':'bad'}" data-result="${ok?'correct':'miss'}">${tag(q.section)} <span class="meta">第${q.id}問｜${escaping(q.topic)}｜${ok?'○ 正解':ans===undefined?'− 未解答':'× 不正解'}</span><h4>${escaping(q.question)}</h4><p>あなたの解答：<strong>${ans===undefined?'未解答':labels[ans]+'　'+escaping(q.options[ans])}</strong></p><p style="color:#067762">正解：<strong>${labels[q.answer]}　${escaping(q.options[q.answer])}</strong></p><p class="explanation"><strong>解説：</strong> ${escaping(q.explanation)}</p></article>`}).join('')}</div><div class="button-row"><button class="btn secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">最上部に戻る ↑</button></div></div>`;}
function filterReview(which){document.querySelectorAll('.reviewitem').forEach(el=>el.classList.toggle('hidden',which==='miss'&&el.dataset.result!=='miss'));}
function downloadCSV(){let rows=[['設問','分野','正解','自分の解答','正誤']];for(let q of QUESTIONS){let a=state.answers[q.id-1];rows.push([q.id,q.section,labels[q.answer],a===undefined?'未解答':labels[a],a===q.answer?'正解':'不正解'])}const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='itpassport_mock_100q_result.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function tick(){if(!state.started||state.finished||state.mode!=='exam')return;if(timeleft()===0){complete(true);return;}const c=$('clock');if(c)c.textContent=formatTime(timeleft());}
window.addEventListener('keydown',e=>{if(!state.started||state.finished||e.target?.tagName==='INPUT')return;if('1234'.includes(e.key))choose(parseInt(e.key)-1);else if(e.key==='ArrowRight')move(state.current+1);else if(e.key==='ArrowLeft')move(state.current-1);});
window.addEventListener('beforeunload',save);setInterval(tick,1000);load();
</script></body></html>
